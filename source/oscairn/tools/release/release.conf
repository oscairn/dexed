# Oscairn plugin release configuration.
#
# The ONE place holding this repo's release facts. When copying this release setup to
# another Oscairn plugin fork, edit only this file; build.sh, check_deps.py,
# licenses.sh, manifest.py and selfcheck.py stay generic.
#
# KEY=VALUE, one per line, comments on their own line: sourced by POSIX sh and
# parsed by the Python scripts the same way.

NAME=oscairn-fm
# File stem of each release asset: <NAME>-<platform>.clap

PACKAGE_ID=org.oscairn.fm
PACKAGE_NAME="Oscairn FM"
PACKAGE_SUMMARY="FM synthesizer based on Dexed/MSFA, with Oscairn sound contexts, snapshots, voice budget and instance sharing; built-in cartridges are Jean-Marc Desprez's SynprezFM compilation, as in upstream Dexed."
# SPDX expression, as published in the packages repo (quoted: sourced by sh, and it has spaces):
LICENSE="GPL-3.0-or-later AND MIT AND Apache-2.0 AND 0BSD"
# Every plugin in the bundle as "descriptor-file=kind" pairs (kind: synth | effect |
# note-effect); each plugin's own version is read from its clap_plugin_descriptor_t:
PLUGINS="source/oscairn/OscairnFm.cpp=synth"
# No separate package version exists in this repo's source: the bundle is the one
# plugin, so the package version IS its descriptor version (bump OscairnFm.cpp's
# descriptor, and the tag follows). Add PROJECT_VERSION_FILE instead if a second
# plugin's version ever diverges from the package's.
PACKAGE_VERSION_DESCRIPTOR=source/oscairn/OscairnFm.cpp
SOURCE_URL=https://github.com/oscairn/dexed
# Releases are tagged oscairn-vX.Y.Z (upstream v* tags exist in forks):
TAG_PREFIX=oscairn-
# CMake tree to configure (this repo's top level), and the .clap it produces in the
# build dir (the oscairn_fm target lands in build/oscairn/):
CMAKE_SOURCE_DIR=.
CLAP_FILE=oscairn/oscairn-fm.clap
# Extra configure flags, the same the oscairn-tests workflow uses (no plugin copies
# into the user's folders, no ALSA, no VST3; Ninja as there):
CMAKE_FLAGS="-G Ninja -DDEXED_COPY_PLUGIN_AFTER_BUILD=OFF -DDEXED_NO_ALSA=ON -DDEXED_SKIP_VST3=ON"
CLAP_VERSION_FILE=libs/clap-juce-extensions/clap-libs/clap/include/clap/version.h
# The vendored oscairn-clap headers record their commit in the README's prose
# (this repo has no upstream.json for them):
OSCAIRN_CLAP_UPSTREAM=libs/oscairn-clap/README.md
# Asset dependencies as "id@version" pairs (from the published record):
ASSET_DEPS="org.oscairn.fm-cartridges@1.0.0"
# Licence/notice files the binary needs, as "path=licenses-name" pairs -> licenses/<name>.
# What oscairn_fm actually links: dexed (GPL-3), msfa (Apache-2.0), tuning-library
# (MIT, via dexed_engine), the CLAP and oscairn-clap headers (MIT), the MTS-ESP
# client (0BSD, compiled into dexed_engine), and the SynprezFM cartridge notice:
LICENSE_FILES="LICENSE=dexed-LICENSE source/msfa/LICENSE=msfa-LICENSE libs/clap-juce-extensions/clap-libs/clap/LICENSE=clap-LICENSE libs/oscairn-clap/LICENSE=oscairn-clap-LICENSE libs/MTS-ESP/LICENSE=MTS-ESP-LICENSE libs/tuning-library/LICENSE.md=tuning-library-LICENSE.md assets/SynprezFM-NOTICE=SynprezFM-NOTICE"
