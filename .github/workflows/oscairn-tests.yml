name: oscairn-tests

# Builds the engine, the CLAPs and the tests, and runs them (docs/oscairn-plan.md, M0-M1).
on:
  push:
    branches: [ oscairn ]
  pull_request:
    branches: [ oscairn ]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            build_type: Release
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            build_type: Release
          - name: macOS
            os: macos-15
            build_type: Release
          - name: Linux ASan and UBSan
            os: ubuntu-24.04
            build_type: Debug
            sanitize: -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer
          - name: Linux TSan
            os: ubuntu-24.04
            build_type: Debug
            sanitize: -fsanitize=thread
            targets: oscairn-fm-test-linked dexed-render-engine
            tests: engine-two-rates|fm-threads
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Linux packages
      if: runner.os == 'Linux'
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxinerama-dev libxext-dev \
          libxrandr-dev libxcursor-dev libfreetype6-dev libfontconfig1-dev libglu1-mesa-dev xvfb

    - name: Install macOS packages
      if: runner.os == 'macOS'
      run: brew install ninja

    - name: Configure
      run: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DDEXED_COPY_PLUGIN_AFTER_BUILD=OFF -DDEXED_NO_ALSA=ON -DDEXED_SKIP_VST3=ON \
          "-DCMAKE_CXX_FLAGS=${{ matrix.sanitize }}" "-DCMAKE_C_FLAGS=${{ matrix.sanitize }}" \
          "-DCMAKE_EXE_LINKER_FLAGS=${{ matrix.sanitize }}" "-DCMAKE_MODULE_LINKER_FLAGS=${{ matrix.sanitize }}"

    - name: Build
      run: |
        cmake --build build --target ${{ matrix.targets || 'dexed_engine dexed-render-engine dexed-render-plugin Dexed_CLAP oscairn_fm oscairn-fm-test oscairn-fm-test-linked oscairn-fm-privacy-host' }}

    - name: Test
      run: |
        args="--test-dir build --output-on-failure"
        if [ -n "${{ matrix.tests }}" ]; then args="$args -R ${{ matrix.tests }}"; fi
        if [ "$RUNNER_OS" = Linux ]; then
          xvfb-run -a ctest $args
        else
          ctest $args
        fi

    - name: CPU benchmark (informational, not a gate)
      if: matrix.build_type == 'Release'
      run: build/tests/oscairn-fm-test-linked bench
